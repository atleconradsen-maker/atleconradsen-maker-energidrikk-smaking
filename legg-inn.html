<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legg inn test – Energidrikk Smaking</title>
<link rel="icon" href="logo.jpg">
<meta name="theme-color" content="#07122b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07122b;--panel:#0e1c3d;--line:#223766;--line2:#1a2c55;--ink:#f4f6fb;--muted:#9fb0d0;--gold:#e2c98f;--gold2:#f1dcaa;--on-gold:#1a1408;--good:#8fe08a;--bad:#ff8a7a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(900px 420px at 50% -200px,#17336f 0%,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none}
header img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.3px;line-height:1}
.lbl{font-size:13px;font-weight:800;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;display:block}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6f84b3}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hint{font-size:14px;border-radius:12px;padding:10px 12px;margin-top:8px}
.hint.known{background:#14301f;color:var(--good)}
.hint.new{background:var(--panel);color:var(--muted)}
.hint.similar{background:#3a2d12;color:var(--gold2)}
.hint .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px;color:var(--muted)}
.pill.on{border-color:var(--gold);color:var(--gold);background:rgba(226,201,143,.1)}
.pill.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pill small{opacity:.75}
.photo{position:relative;border:1.5px dashed #33497d;background:#0b1834;border-radius:18px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:700;cursor:pointer;overflow:hidden}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(7,18,43,.85);color:#fff;font-size:22px;z-index:2}
.names{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.tester{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px}
.th b{font-size:18px}
.tot{font-family:Anton,sans-serif;font-size:30px;color:var(--gold);line-height:1}
.step{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line2);margin-top:8px}
.step span{font-weight:600}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.ctl output{width:38px;text-align:center;font-family:Anton,sans-serif;font-size:24px;color:var(--gold)}
.ctl output.empty{color:#4e6394}
.rm{background:none;border:0;color:var(--bad);font-weight:700;padding:8px 0;min-height:40px}
.empty-t{color:var(--muted);text-align:center}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:10}
.save button{display:block;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:999px;padding:17px;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:17px;box-shadow:0 6px 0 #9c844f}
.save button:disabled{opacity:.6}
.msg{border-radius:16px;padding:14px 16px;font-size:15px}
.msg.err{background:#3d1f1c;color:var(--bad)}
.msg.ok{background:#14301f;color:var(--good)}
.msg a{color:var(--gold)}
.hidden{display:none!important}
</style>
</head>
<body>
<form class="wrap" id="f" autocomplete="off" novalidate>
  <header>
    <a class="back" href="./" aria-label="Tilbake til forsiden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <img src="logo.jpg" alt="">
    <h1>Legg inn test</h1>
  </header>

  <div class="msg err hidden" id="setup">Innleggingen er ikke koblet til regnearket ennå. Se README.md (Apps Script) for oppsett.</div>

  <div>
    <span class="lbl">Bilde av boksen</span>
    <label class="photo" id="photo"><input type="file" accept="image/*" capture="environment" id="bilde" aria-label="Ta eller velg bilde av boksen">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Ta bilde
    </label>
  </div>

  <div>
    <label class="lbl" for="merke">Merke</label>
    <input id="merke" maxlength="40" placeholder="F.eks. Monster, Red Bull, Nocco" enterkeyhint="next">
    <div class="names" id="brands"></div>
    <div class="hint hidden" id="bhint"></div>
  </div>

  <div class="hidden" id="typeBox">
    <label class="lbl" for="type">Hvilken type?</label>
    <input id="type" maxlength="60" placeholder="F.eks. Ultra White, Original, Sukkerfri" enterkeyhint="next">
    <div class="names" id="types"></div>
    <div class="hint hidden" id="hint"></div>
  </div>

  <div class="two">
    <label>Pris (kr)<input id="pris" type="number" inputmode="decimal" step="0.1" min="0" placeholder="19,90"></label>
    <label>Størrelse (cl)<input id="cl" type="number" inputmode="numeric" min="0" placeholder="50"></label>
  </div>

  <div class="two">
    <label>Uke<input id="uke" type="number" inputmode="numeric" min="1" max="53"></label>
    <label>År<input id="aar" type="number" inputmode="numeric" min="2020" max="2100"></label>
  </div>

  <div>
    <span class="lbl">Hvem smakte?</span>
    <div class="names" id="names" style="margin-top:0"></div>
    <div class="addrow" style="margin-top:10px"><input id="nyNavn" maxlength="40" placeholder="Ny tester – fullt navn" enterkeyhint="done"><button type="button" class="pill gold" id="addBtn">Legg til</button></div>
    <div id="testers"></div>
  </div>

  <div>
    <label class="lbl" for="kommentar">Kommentar</label>
    <textarea id="kommentar" maxlength="400" placeholder="Valgfritt – f.eks. «Mye leske for pengene»"></textarea>
  </div>

  <div class="msg hidden" id="msg"></div>
</form>
<div class="save"><button type="submit" form="f" id="saveBtn">Lagre test</button></div>

<script src="config.js?v=202611260800"></script>
<script src="parse.js?v=202611260800"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.EDConfig || {};
const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const state = {testere: [], bilde: null, confirmed: null, brandNew: null};
let drinks = [], testerNames = [];
if (!cfg.SCRIPT_URL) $('#setup').classList.remove('hidden');

// ----- uke og år (ISO-uke) -----
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return {week: Math.ceil(((t - y0) / 864e5 + 1) / 7), year: t.getUTCFullYear()};
}
{ const w = isoWeek(new Date()); $('#uke').value = w.week; $('#aar').value = w.year; }

// ----- navn-sammenligning (samme drikk skrevet litt ulikt) -----
const K = s => String(s || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function similar(a, b) {
  const x = K(a), y = K(b); if (!x || !y) return false; if (x === y) return true;
  if (Math.min(x.length, y.length) >= 6 && (x.includes(y) || y.includes(x))) return true;
  return lev(x, y) <= Math.max(1, Math.floor(Math.max(x.length, y.length) / 6));
}

// ----- kjente drikker og testere fra regnearket -----
function gviz() {
  return new Promise((resolve, reject) => {
    if (!cfg.SHEET_ID) return reject(new Error('no sheet'));
    const cb = '__edf' + Date.now(), sc = document.createElement('script');
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(to); };
    const to = setTimeout(() => { done(); reject(new Error('timeout')); }, 12000);
    window[cb] = res => { done(); res && res.table ? resolve(res.table) : reject(new Error('gviz')); };
    sc.onerror = () => { done(); reject(new Error('load')); };
    sc.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(cfg.SHEET_ID)}/gviz/tq?gid=0&headers=1&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.head.append(sc);
  });
}
const avg = a => { const x = a.filter(v => v != null); return x.length ? x.reduce((s, v) => s + v, 0) / x.length : null; };
gviz().then(t => {
  const data = EDParse.parseRows(EDParse.gvizToRows(t));
  testerNames = data.testers || [];
  const map = new Map();
  for (const x of data.tests) {
    const k = K(x.brand) + '|' + K(x.drink);
    const tot = avg(x.scores.map(s => avg([s.taste, s.value])));
    if (!map.has(k)) map.set(k, {brand: x.brand, drink: x.drink, price: x.price, ml: x.ml, n: 0, tot});
    map.get(k).n++;
  }
  drinks = [...map.values()];
  buildBrands(); refreshBrand(); drawNames();
}).catch(() => { drawNames(); });

// ----- merke først, så type -----
const DEFAULT_BRANDS = ['Monster', 'Red Bull', 'Burn', 'Celsius', 'Nocco', 'Battery', 'Powerking', 'Prime'];
const merkeIn = $('#merke'), typeIn = $('#type');
let brands = DEFAULT_BRANDS.slice();
function buildBrands() {
  const count = new Map();
  drinks.forEach(d => { if (d.brand) { const k = K(d.brand); const c = count.get(k) || {name: d.brand, n: 0}; c.n += d.n; count.set(k, c); } });
  brands = [...[...count.values()].sort((a, b) => b.n - a.n).map(x => x.name), ...DEFAULT_BRANDS.filter(b => !count.has(K(b)) && ![...count.keys()].some(k => similar(k, b)))];
}
function brandMatch() {
  const v = merkeIn.value.trim(), k = K(v);
  if (!k) return {mode: 'none'};
  const exact = brands.find(b => K(b) === k);
  if (exact) return {mode: 'known', name: exact};
  if (state.brandNew === k) return {mode: 'new', name: v};
  const sim = brands.find(b => similar(b, v));
  return sim ? {mode: 'similar', name: sim} : {mode: 'new', name: v};
}
const brandName = () => { const m = brandMatch(); return m.mode === 'known' || m.mode === 'new' ? m.name : ''; };
const ownDrinks = () => { const bk = K(brandName()); return bk ? drinks.filter(d => K(d.brand) === bk) : []; };
function matchDrink() {
  const v = typeIn.value.trim(), k = K(v);
  if (!k || !brandName()) return {mode: 'none'};
  const own = ownDrinks();
  const exact = own.find(d => K(d.drink) === k);
  if (exact) return {mode: 'known', drink: exact};
  if (state.confirmed === k) return {mode: 'new'};
  const sim = own.find(d => similar(d.drink, v));
  return sim ? {mode: 'similar', drink: sim} : {mode: 'new'};
}
function refreshBrand() {
  const v = merkeIn.value.trim(), k = K(v), m = brandMatch(), bh = $('#bhint');
  const list = brands.filter(b => !k || K(b).includes(k) || similar(b, v)).filter(b => K(b) !== k).slice(0, 8);
  $('#brands').innerHTML = list.map(b => `<button type="button" class="pill" data-brand="${esc(b)}">${esc(b)}</button>`).join('');
  bh.className = 'hint ' + m.mode;
  bh.classList.toggle('hidden', m.mode !== 'similar');
  if (m.mode === 'similar') bh.innerHTML = `Mener du <b>${esc(m.name)}</b>?<div class="row"><button type="button" class="pill gold" data-byes>Ja</button><button type="button" class="pill" data-bno>Nei, det er et nytt merke</button></div>`;
  $('#typeBox').classList.toggle('hidden', !brandName());
  refreshType();
  return m;
}
function refreshType() {
  const tk = K(typeIn.value), hint = $('#hint');
  const types = ownDrinks().filter(d => (!tk || K(d.drink).includes(tk) || similar(d.drink, typeIn.value)) && K(d.drink) !== tk).slice(0, 8);
  $('#types').innerHTML = types.map(d => `<button type="button" class="pill" data-type="${esc(d.drink)}">${esc(d.drink)} <small>${fmt(d.tot)}</small></button>`).join('');
  const m = matchDrink();
  hint.className = 'hint ' + m.mode;
  hint.classList.toggle('hidden', m.mode === 'none');
  if (m.mode === 'known') {
    hint.innerHTML = `Testet før: <b>${esc(m.drink.brand)} ${esc(m.drink.drink)}</b>. Den nye testen havner på samme drikk.`;
    if (!$('#pris').value && m.drink.price != null) $('#pris').value = m.drink.price;
    if (!$('#cl').value && m.drink.ml) $('#cl').value = Math.round(m.drink.ml / 10);
  } else if (m.mode === 'similar') hint.innerHTML = `Mener du <b>${esc(m.drink.drink)}</b>?<div class="row"><button type="button" class="pill gold" data-yes>Ja, det er den</button><button type="button" class="pill" data-no>Nei, det er en ny type</button></div>`;
  else if (m.mode === 'new') hint.innerHTML = `Ny drikk: <b>${esc(brandName())} ${esc(typeIn.value.trim())}</b>.`;
  return m;
}
merkeIn.addEventListener('input', () => { state.brandNew = null; state.confirmed = null; refreshBrand(); });
typeIn.addEventListener('input', () => { state.confirmed = null; refreshType(); });
$('#brands').addEventListener('click', e => { const b = e.target.closest('[data-brand]'); if (!b) return; merkeIn.value = b.dataset.brand; state.confirmed = null; refreshBrand(); typeIn.focus(); });
$('#types').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; typeIn.value = b.dataset.type; refreshType(); });
$('#bhint').addEventListener('click', e => {
  if (e.target.closest('[data-byes]')) { merkeIn.value = brandMatch().name; refreshBrand(); typeIn.focus(); }
  else if (e.target.closest('[data-bno]')) { state.brandNew = K(merkeIn.value); refreshBrand(); typeIn.focus(); }
});
$('#hint').addEventListener('click', e => {
  if (e.target.closest('[data-yes]')) { typeIn.value = matchDrink().drink.drink; refreshType(); }
  else if (e.target.closest('[data-no]')) { state.confirmed = K(typeIn.value); refreshType(); }
});
refreshBrand();

// ----- bilde (gjøres mindre i nettleseren før opplasting) -----
$('#bilde').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    state.bilde = await resize(f, 1600, 0.82);
    const box = $('#photo'); box.querySelectorAll('img,.x').forEach(n => n.remove());
    const im = document.createElement('img'); im.src = state.bilde; im.alt = 'Bilde av boksen'; box.append(im);
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Fjern bilde');
    x.onclick = ev => { ev.preventDefault(); clearPhoto(); };
    box.append(x);
  } catch { show('err', 'Klarte ikke å lese bildet. Prøv et annet.'); }
});
function clearPhoto() { state.bilde = null; $('#photo').querySelectorAll('img,.x').forEach(n => n.remove()); $('#bilde').value = ''; }
function resize(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}

// ----- testere -----
const has = n => state.testere.some(t => t.navn.toLowerCase() === n.toLowerCase());
function addTester(name) {
  name = String(name || '').trim().slice(0, 40);
  if (!name || has(name)) return;
  const known = testerNames.find(n => n.toLowerCase() === name.toLowerCase() || similar(n, name));
  state.testere.push({navn: known || name, smak: null, verdi: null});
  drawTesters(); drawNames();
}
function drawNames() {
  $('#names').innerHTML = testerNames.map(n => `<button type="button" class="pill${has(n) ? ' on' : ''}" data-name="${esc(n)}">${has(n) ? '✓ ' : '+ '}${esc(n)}</button>`).join('');
}
$('#names').addEventListener('click', e => {
  const b = e.target.closest('[data-name]'); if (!b) return;
  const n = b.dataset.name;
  if (has(n)) { state.testere = state.testere.filter(t => t.navn.toLowerCase() !== n.toLowerCase()); drawTesters(); drawNames(); }
  else addTester(n);
});
$('#addBtn').addEventListener('click', () => { addTester($('#nyNavn').value); $('#nyNavn').value = ''; });
$('#nyNavn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTester(e.target.value); e.target.value = ''; } });
function drawTesters() {
  const box = $('#testers');
  if (!state.testere.length) { box.innerHTML = `<div class="tester empty-t">Trykk på navnene til de som smakte.</div>`; return; }
  box.innerHTML = state.testere.map((t, i) => {
    const tot = t.smak != null && t.verdi != null ? (t.smak + t.verdi) / 2 : (t.smak ?? t.verdi);
    const step = (k, l) => `<div class="step"><span>${l}</span><div class="ctl"><button type="button" data-i="${i}" data-k="${k}" data-d="-1" aria-label="${l} ned">−</button><output class="${t[k] == null ? 'empty' : ''}">${t[k] ?? '–'}</output><button type="button" data-i="${i}" data-k="${k}" data-d="1" aria-label="${l} opp">+</button></div></div>`;
    return `<div class="tester"><div class="th"><b>${esc(t.navn)}</b><span class="tot">${fmt(tot)}</span></div>
      ${step('smak', 'Smak')}${step('verdi', 'Smak vs. pris')}
      <button type="button" class="rm" data-rm="${i}">Fjern ${esc(t.navn.split(' ')[0])}</button></div>`;
  }).join('');
}
$('#testers').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rm) { state.testere.splice(+b.dataset.rm, 1); drawTesters(); drawNames(); return; }
  if (b.dataset.k) { const t = state.testere[+b.dataset.i], k = b.dataset.k, d = +b.dataset.d; t[k] = t[k] == null ? 5 + (d > 0 ? 1 : 0) : Math.min(10, Math.max(1, t[k] + d)); drawTesters(); }
});
drawTesters();

// ----- lagre -----
function show(kind, html) { const m = $('#msg'); m.className = 'msg ' + kind; m.innerHTML = html; m.scrollIntoView({behavior: 'smooth', block: 'center'}); }
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  if (!cfg.SCRIPT_URL) return show('err', 'Innleggingen er ikke koblet til regnearket ennå.');
  const bm = refreshBrand();
  if (bm.mode === 'none') { merkeIn.focus(); return show('err', 'Skriv inn merket først.'); }
  if (bm.mode === 'similar') return show('err', `Er «${esc(merkeIn.value.trim())}» det samme som «${esc(bm.name)}»? Svar ja eller nei under merket.`);
  if (!typeIn.value.trim()) { typeIn.focus(); return show('err', 'Skriv hvilken type det er, f.eks. Original.'); }
  const m = refreshType();
  if (m.mode === 'similar') return show('err', `Er det samme som «${esc(m.drink.drink)}»? Svar ja eller nei under typen.`);
  const testere = state.testere.filter(t => t.smak != null || t.verdi != null);
  if (!testere.length) return show('err', 'Gi minst én score.');
  const body = {
    test: {aar: $('#aar').value, uke: $('#uke').value, merke: brandName(), drikk: m.mode === 'known' ? m.drink.drink : typeIn.value.trim(),
      pris: $('#pris').value, cl: $('#cl').value, kommentar: $('#kommentar').value.trim()},
    testere, bilde: state.bilde
  };
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = state.bilde ? 'Laster opp bilde …' : 'Lagrer …';
  try {
    const r = await fetch(cfg.SCRIPT_URL, {method: 'POST', body: JSON.stringify(body)});
    const res = await r.json();
    if (!res.ok) throw new Error(res.feil || 'Ukjent feil');
    show('ok', `<b>Takk!</b> ${esc(body.test.merke)} ${esc(body.test.drikk)} er lagret. <a href="./#week">Se testen</a>`);
    state.testere.forEach(t => { t.smak = t.verdi = null; });
    clearPhoto(); ['#merke', '#type', '#pris', '#cl', '#kommentar'].forEach(s => $(s).value = '');
    state.brandNew = state.confirmed = null; refreshBrand(); drawTesters();
  } catch (err) {
    show('err', 'Kunne ikke lagre: ' + esc(err.message || err) + '. Prøv igjen.');
  } finally { btn.disabled = false; btn.textContent = 'Lagre test'; }
});
}
</script>
</body>
</html>
